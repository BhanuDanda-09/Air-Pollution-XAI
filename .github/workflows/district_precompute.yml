name: Scheduled District AQI Precompute

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  precompute-districts:
    name: Precompute All-India District Centroids & State AQI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run District Precompute Job
        env:
          PYTHONPATH: .
        run: |
          python src/precompute_district_forecasts.py

      - name: Commit and push updated precomputed dataset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Cron"
          git add dataset/precomputed_district_aqi.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): refresh precomputed all-India district AQI [skip ci]" && git push)
