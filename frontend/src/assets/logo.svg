<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="logoIconDial" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="logoIconBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="logoWind" x1="8" y1="24" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (48x48 centered in 60h) -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="12" fill="url(#logoIconBg)"/>
    <rect x="1" y="1" width="46" height="46" rx="11" stroke="url(#logoIconDial)" stroke-width="1.8" stroke-opacity="0.5"/>
    
    <!-- Gauge Meter Arc -->
    <path d="M10 32 A 16 16 0 1 1 38 32" stroke="url(#logoIconDial)" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Flowing Air Stream -->
    <path d="M8 24 C 14 20, 20 28, 26 24 C 31 20.5, 35 22, 40 23" stroke="url(#logoWind)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Location Pin / Pointer -->
    <path d="M24 13 C 20.7 13, 18 15.7, 18 19 C 18 23.5, 24 31, 24 31 C 24 31, 30 23.5, 30 19 C 30 15.7, 27.3 13, 24 13 Z" fill="#0EA5E9"/>
    <circle cx="24" cy="19" r="3" fill="#FFFFFF"/>
    <circle cx="24" cy="19" r="1.5" fill="#10B981"/>
  </g>

  <!-- Wordmark -->
  <text x="66" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#0F172A" letter-spacing="-0.03em">
    Air<tspan fill="#0284C7">IQ</tspan>
  </text>
  <text x="144" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#10B981" letter-spacing="-0.01em">
    India
  </text>

  <!-- Tagline Subtext -->
  <text x="67" y="51" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="0.04em" text-transform="uppercase">
    Smarter Air Decisions
  </text>
</svg>
