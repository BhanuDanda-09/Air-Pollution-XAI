<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="airIqDial" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="airIqBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="windGrad" x1="6" y1="12" x2="26" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect width="32" height="32" rx="7.5" fill="url(#airIqBg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" stroke="url(#airIqDial)" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Gauge Arc (AQI Meter) -->
  <path d="M7 21 A 10 10 0 1 1 25 21" stroke="url(#airIqDial)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Wind Wave (Flowing Air) -->
  <path d="M6 16 C 10 13, 14 19, 18 16 C 21 13.5, 24 14, 26 15" stroke="url(#windGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Location Pin & Gauge Needle -->
  <path d="M16 8 C 13.8 8, 12 9.8, 12 12 C 12 15, 16 20, 16 20 C 16 20, 20 15, 20 12 C 20 9.8, 18.2 8, 16 8 Z" fill="#0EA5E9" opacity="0.95"/>
  <circle cx="16" cy="12" r="2" fill="#FFFFFF"/>

  <!-- Live Pulse Dot in Center Pin -->
  <circle cx="16" cy="12" r="1" fill="#10B981"/>
</svg>
